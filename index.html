<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mobile Repair AI Pro</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1020;color:#eef2ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0b1020,#121a2e);min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:24px}.hero{padding:22px 0}.hero h1{margin:0 0 6px;font-size:30px}.hero p{margin:0;color:#aab5d6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#151e34;border:1px solid #283452;border-radius:16px;padding:18px;box-shadow:0 10px 30px #0003}.card h2{font-size:18px;margin:0 0 14px}.wide{grid-column:1/-1}label{display:block;margin:10px 0 6px;color:#b9c4e4;font-size:13px}input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #354263;background:#0d1426;color:#fff;outline:none}textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:11px;padding:12px 18px;background:#6d7cff;color:white;font-weight:700;cursor:pointer}button.secondary{background:#273553}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.result{margin-top:16px}.confidence{font-size:38px;font-weight:800}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#263454;margin:4px;font-size:12px}.danger{color:#ffb4b4}.muted{color:#9eabd0}.item{padding:10px 0;border-bottom:1px solid #283452}.item:last-child{border-bottom:0}.small{font-size:12px}.ok{color:#8fe3ad}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.row{grid-template-columns:1fr}}
</style></head>
<body><main class="wrap">
<section class="hero"><h1>🔧 Mobile Repair AI Pro</h1><p>مساعد تشخيص أعطال مبني على الأدلة والقياسات — لا يستبدل القطع عشوائيًا.</p></section>
<section class="grid">
<div class="card"><h2>بيانات الجهاز</h2><label>الشركة</label><input id="brand" placeholder="Apple / Samsung / Xiaomi..."><label>الموديل</label><input id="model" placeholder="مثال: iPhone 13 Pro"><label>Board / Revision</label><input id="board" placeholder="إن كانت معروفة"><label>نوع العطل</label><select id="fault"><option value="no_power">لا يعمل / Dead</option><option value="charging">لا يشحن</option><option value="bootloop">Bootloop / Restart</option><option value="display">صورة / إضاءة</option><option value="network">شبكة / Baseband</option></select></div>
<div class="card"><h2>كيف حدث العطل؟</h2><label>السبب أو التاريخ المرضي</label><textarea id="history" placeholder="سقوط، ماء، صيانة سابقة، توقف مفاجئ، بعد تحديث..."></textarea><label>الوصف الفني</label><textarea id="symptoms" placeholder="صف السلوك بدقة وما الذي جربته"></textarea></div>
<div class="card"><h2>القياسات</h2><div class="row"><div><label>سحب الباور</label><input id="current" placeholder="0A → 0.08A → 0A"></div><div><label>المقاومة إلى الأرضي (Ω)</label><input id="resistance" placeholder="مثال: 18"></div></div><div class="row"><div><label>Diode Mode</label><input id="diode" placeholder="مثال: 0.312V"></div><div><label>Rail / Voltage</label><input id="rail" placeholder="PP_VDD_MAIN = 4.2V"></div></div><label>الحرارة / المكوّن الساخن</label><input id="thermal" placeholder="لا توجد / PMIC ساخن / منطقة محددة..."><label>قياسات إضافية</label><textarea id="extra" placeholder="USB current، clock، reset، enable، نتائج المقارنة مع بورد سليم..."></textarea></div>
<div class="card"><h2>الفحص البصري</h2><label>نتيجة الفحص</label><textarea id="visual" placeholder="أكسدة، كسر، مكوّن مفقود، آثار صدمة..."></textarea><div class="actions"><button class="secondary" onclick="fillDemo()">تعبئة مثال اختبار</button><button onclick="analyzeCase()">تحليل العطل</button></div></div>
<div class="card wide result" id="result"><h2>نتيجة التشخيص</h2><p class="muted">أدخل البيانات واضغط «تحليل العطل».</p></div>
</section></main><script src="/app.js"></script></body></html>

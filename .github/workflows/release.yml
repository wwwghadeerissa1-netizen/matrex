name: Build Matrex Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/matrex-release.keystore"
          test -s "$RUNNER_TEMP/matrex-release.keystore"

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/matrex-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          gradle assembleRelease --stacktrace \
            -PmatrexKeystorePath="$KEYSTORE_PATH" \
            -PmatrexKeystorePassword="$KEYSTORE_PASSWORD" \
            -PmatrexKeyAlias="$KEY_ALIAS" \
            -PmatrexKeyPassword="$KEY_PASSWORD"

      - name: Validate release APK
        working-directory: android
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk >/dev/null
          echo "Matrex release APK exists and passed ZIP integrity validation."

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Matrex-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
